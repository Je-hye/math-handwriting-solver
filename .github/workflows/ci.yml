name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check font files exist
        run: |
          test -f fonts/NanumPenScript-Regular.ttf || (echo "ERROR: NanumPenScript-Regular.ttf not found" && exit 1)
          test -f fonts/NanumGothic-Regular.ttf || (echo "ERROR: NanumGothic-Regular.ttf not found" && exit 1)
          echo "Font files OK"

      - name: Run tests
        run: pytest
